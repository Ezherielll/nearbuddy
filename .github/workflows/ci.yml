name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-release:
    name: Build Release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Build split release APKs (prod, obfuscated)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/prod --flavor prod --dart-define=FLAVOR=prod
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nearbuddy-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: nearbuddy-symbols
          path: build/symbols/
