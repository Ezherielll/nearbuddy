name: nearbuddy
description: Offline group chat using Nearby Connections.
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  nearby_connections: ^4.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  shared_preferences: ^2.3.2
  geolocator: ^12.0.0
  uuid: ^4.4.2
  permission_handler: ^11.3.1
  battery_plus: ^7.1.1
  go_router: ^14.3.0
  url_launcher: ^6.3.0
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  shadcn_ui: ^0.56.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  chat_bubbles: ^1.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.18.0
  mockito: ^5.4.4
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
